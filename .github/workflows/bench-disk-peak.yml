#
# THROWAWAY BENCHMARK - not for upstream.
#
# How much disk does a job actually consume when scripts/tools/free_up_disk_space.sh
# is NOT run? Production logs only report df during a job's setup phase, so the two
# heaviest job classes are unmeasured. Both arms deliberately skip the cleanup and
# sample df throughout, so the low-water mark is the real footprint.
---
name: "bench: disk peak"
on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - bench/disk-peak
  workflow_dispatch:
permissions:
  contents: read
jobs:
  peak:
    name: "${{ matrix.arm }}"
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arm: [k8s, ci-image-build]
    env:
      PYTHON_MAJOR_MINOR_VERSION: "3.10"
      KUBERNETES_VERSION: "v1.30.13"
      EXECUTOR: KubernetesExecutor
      USE_STANDARD_NAMING: "true"
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_USERNAME: ${{ github.actor }}
      VERBOSE: "false"
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Deliberately no ./scripts/tools/free_up_disk_space.sh - that is the variable
      # under test. /mnt still has to be writeable for breeze.
      - name: "Make /mnt writeable"
        run: ./scripts/ci/make_mnt_writeable.sh

      - name: "Start disk sampler"
        run: |
          ( while :; do echo "$(date +%s) $(df --output=used,avail -B1 / | tail -1)"; sleep 2; done ) \
            > /tmp/disk.log 2>/dev/null &
          echo $! > /tmp/sampler.pid
          df -H /

      - name: "Install Breeze"
        uses: ./.github/actions/breeze
        id: breeze

      - name: "Build the image this arm needs"
        env:
          ARM: ${{ matrix.arm }}
        run: |
          if [[ "${ARM}" == "k8s" ]]; then
            breeze prod-image build --python "${PYTHON_MAJOR_MINOR_VERSION}"
          else
            breeze ci-image build --python "${PYTHON_MAJOR_MINOR_VERSION}"
          fi

      - name: "Run complete K8S tests"
        if: matrix.arm == 'k8s'
        run: breeze k8s run-complete-tests --upgrade --no-copy-local-sources

      - name: "Report the disk trajectory"
        if: always()
        run: |
          kill "$(cat /tmp/sampler.pid)" 2>/dev/null || true
          python3 - <<'EOF' | tee -a "${GITHUB_STEP_SUMMARY}"
          import os
          rows = []
          for line in open("/tmp/disk.log"):
              p = line.split()
              if len(p) == 3:
                  rows.append((int(p[0]), int(p[1]), int(p[2])))
          if not rows:
              raise SystemExit("no samples")
          t0 = rows[0][0]
          G = 1 << 30
          base_used, base_avail = rows[0][1], rows[0][2]
          peak_used = max(r[1] for r in rows)
          low_avail = min(r[2] for r in rows)
          arm = os.environ.get("ARM", "?")
          print(f"PEAK arm={arm} samples={len(rows)} span_min={(rows[-1][0]-t0)/60:.1f}"
                f" used_start_gb={base_used/G:.1f} used_peak_gb={peak_used/G:.1f}"
                f" avail_start_gb={base_avail/G:.1f} avail_low_gb={low_avail/G:.1f}"
                f" footprint_gb={(peak_used-base_used)/G:.1f}")
          print("\ntrajectory (min : used_gb / avail_gb), sampled every ~30s:")
          for r in rows[::15]:
              print(f"  {(r[0]-t0)/60:6.1f} : {r[1]/G:6.1f} / {r[2]/G:6.1f}")
          EOF
        env:
          ARM: ${{ matrix.arm }}
